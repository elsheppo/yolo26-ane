[package]
name = "yolo26-ane"
version = "0.1.0"
edition = "2021"
description = "YOLO26 inference on Apple Neural Engine via CoreML. Zero Python."

[[bin]]
name = "yolo26-ane"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
